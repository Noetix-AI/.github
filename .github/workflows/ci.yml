name: ci

# 本仓库自己的 CI：跑检查脚本的测试，并用 tdd-check 检查本仓库自己的 PR（吃自己的狗粮）。

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 检查脚本自测 (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest tests -v

  tdd:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/tdd-check.yml
    with:
      head-test-paths: tests
      tools-ref: ${{ github.event.pull_request.head.sha }}
